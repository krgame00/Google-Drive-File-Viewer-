name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run all tests
        run: |
          set -e
          for f in tests/*.cjs; do
            echo "== $f"
            node "$f"
          done
      - name: Check collection data is in sync
        run: node tools/collection_data.js check
